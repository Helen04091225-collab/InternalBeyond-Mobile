<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Data Export</title></head>
<body>
<h2>InternalBeyond Data Export</h2>
<p id="status">正在读取数据库...</p>
<script>
var statusEl = document.getElementById('status');

function exportAllDBs() {
  var allData = {};
  var dbNames = ['InternalBeyondDB', 'IB_Media'];
  var doneDBs = 0;

  dbNames.forEach(function(dbName) {
    var req = indexedDB.open(dbName);
    req.onerror = function() {
      statusEl.textContent = '无法打开数据库：' + dbName;
    };
    req.onsuccess = function(e) {
      var db = e.target.result;
      var storeNames = [];
      for (var i = 0; i < db.objectStoreNames.length; i++) {
        storeNames.push(db.objectStoreNames[i]);
      }
      if (storeNames.length === 0) {
        allData[dbName] = {};
        doneDBs++;
        if (doneDBs === dbNames.length) downloadAll(allData);
        db.close();
        return;
      }
      var dbData = {};
      var doneStores = 0;
      storeNames.forEach(function(name) {
        var tx = db.transaction(name, 'readonly');
        var store = tx.objectStore(name);
        var getReq = store.getAll();
        getReq.onsuccess = function(ev) {
          dbData[name] = ev.target.result;
          doneStores++;
          statusEl.textContent = dbName + '：已读取 ' + doneStores + '/' + storeNames.length + ' 个表';
          if (doneStores === storeNames.length) {
            allData[dbName] = dbData;
            db.close();
            doneDBs++;
            if (doneDBs === dbNames.length) downloadAll(allData);
          }
        };
        getReq.onerror = function() {
          doneStores++;
          if (doneStores === storeNames.length) {
            allData[dbName] = dbData;
            db.close();
            doneDBs++;
            if (doneDBs === dbNames.length) downloadAll(allData);
          }
        };
      });
    };
  });
}

function downloadAll(data) {
  var json = JSON.stringify(data);
  statusEl.textContent = '数据读取完成！总大小：' + (json.length / 1024 / 1024).toFixed(2) + ' MB，正在下载...';
  var blob = new Blob([json], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'ib_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() {
    URL.revokeObjectURL(url);
    statusEl.textContent = '下载完成！文件名：' + a.download;
  }, 1000);
}

exportAllDBs();
</script>
</body>
</html>
