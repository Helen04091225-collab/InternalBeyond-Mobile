<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB Data Import</title></head>
<body>
<h2>InternalBeyond Data Import</h2>
<p id="status">选择之前导出的备份文件</p>
<input type="file" id="fileInput" accept=".json">
<script>
var statusEl = document.getElementById('status');
document.getElementById('fileInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  statusEl.textContent = '正在读取文件（' + (file.size / 1024 / 1024).toFixed(1) + ' MB）...';
  var reader = new FileReader();
  reader.onload = function(ev) {
    statusEl.textContent = '文件读取完成，正在解析...';
    try {
      var allData = JSON.parse(ev.target.result);
    } catch(err) {
      statusEl.textContent = '解析失败：' + err.message;
      return;
    }
    var dbNames = Object.keys(allData);
    var doneDBs = 0;
    if (dbNames.length === 0) {
      statusEl.textContent = '备份文件为空';
      return;
    }
    dbNames.forEach(function(dbName) {
      var dbData = allData[dbName];
      var storeNames = Object.keys(dbData);
      if (storeNames.length === 0) {
        doneDBs++;
        if (doneDBs === dbNames.length) statusEl.textContent = '导入完成！';
        return;
      }
      var req = indexedDB.open(dbName);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        storeNames.forEach(function(name) {
          if (!db.objectStoreNames.contains(name)) {
            db.createObjectStore(name, {autoIncrement: true});
          }
        });
      };
      req.onsuccess = function(e) {
        var db = e.target.result;
        var missingStores = [];
        storeNames.forEach(function(name) {
          if (!db.objectStoreNames.contains(name)) missingStores.push(name);
        });
        if (missingStores.length > 0) {
          db.close();
          var version = db.version + 1;
          var req2 = indexedDB.open(dbName, version);
          req2.onupgradeneeded = function(e2) {
            var db2 = e2.target.result;
            missingStores.forEach(function(name) {
              if (!db2.objectStoreNames.contains(name)) {
                db2.createObjectStore(name, {autoIncrement: true});
              }
            });
          };
          req2.onsuccess = function(e2) {
            writeStores(e2.target.result, dbName, dbData, storeNames, function() {
              doneDBs++;
              if (doneDBs === dbNames.length) statusEl.textContent = '全部导入完成！请关闭此页面并重新打开 Dawnhouse。';
            });
          };
          return;
        }
        writeStores(db, dbName, dbData, storeNames, function() {
          doneDBs++;
          if (doneDBs === dbNames.length) statusEl.textContent = '全部导入完成！请关闭此页面并重新打开 Dawnhouse。';
        });
      };
      req.onerror = function() {
        statusEl.textContent = '无法打开数据库：' + dbName;
      };
    });
  };
  reader.onerror = function() {
    statusEl.textContent = '文件读取失败';
  };
  reader.readAsText(file);
});

function writeStores(db, dbName, dbData, storeNames, callback) {
  var doneStores = 0;
  storeNames.forEach(function(name) {
    var records = dbData[name];
    var tx = db.transaction(name, 'readwrite');
    var store = tx.objectStore(name);
    var doneRecords = 0;
    if (records.length === 0) {
      doneStores++;
      statusEl.textContent = dbName + '：已写入 ' + doneStores + '/' + storeNames.length + ' 个表';
      if (doneStores === storeNames.length) { db.close(); callback(); }
      return;
    }
    records.forEach(function(record) {
      var putReq = store.put(record);
      putReq.onsuccess = function() {
        doneRecords++;
        if (doneRecords === records.length) {
          doneStores++;
          statusEl.textContent = dbName + '：已写入 ' + doneStores + '/' + storeNames.length + ' 个表（' + doneRecords + ' 条记录）';
          if (doneStores === storeNames.length) { db.close(); callback(); }
        }
      };
      putReq.onerror = function() {
        doneRecords++;
        if (doneRecords === records.length) {
          doneStores++;
          if (doneStores === storeNames.length) { db.close(); callback(); }
        }
      };
    });
  });
}
</script>
</body>
</html>
